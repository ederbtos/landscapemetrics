services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JWT_SECRET_KEY: change-me-in-production
      APP_ENCRYPTION_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:8000
      COOKIE_SECURE: "true"
      DB_PATH: data/app.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
